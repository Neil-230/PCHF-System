version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fouraxis-backend
    ports:
      - "4001:4000" # Internal backend port
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fouraxis-frontend
    ports:
      - "3001:80" # Assigned port 3001 maps to internal port 80
    restart: always
    environment:
      - VITE_API_URL=/fouraxis/api # Relative path for API
    depends_on:
      - backend

# Optional: Add a volume for MongoDB if you're not using an external DB service
# db:
#   image: mongo
#   ports:
#     - "27017:27017"
